name: Build Blue Moth Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create web folders and copy files
        run: |
          if [ -f www ]; then rm www; fi
          mkdir -p www/assets
          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp moth_icon.png www/assets/
          cp splash.png www/assets/
          cp blue_moth_background.png www/assets/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          pip install pillow
          python make_icons.py

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blue-Moth-Android
          path: android/app/build/outputs/apk/debug/*.apk
